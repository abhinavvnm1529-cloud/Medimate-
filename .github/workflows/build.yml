name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        env:
          AI_URL: ${{ secrets.AI_URL }}
          AI_CODE: ${{ secrets.AI_CODE }}
        run: |
          set -e
          # Find the project no matter how it was uploaded: loose files, a zip, or a zip inside a zip.
          # If several versions are present, the highest APP_VERSION wins.
          python3 - <<'PY'
          import glob, os, re, shutil, subprocess, zipfile
          def unpack(src, dst):
              os.makedirs(dst, exist_ok=True)
              with zipfile.ZipFile(src) as z: z.extractall(dst)
              for _ in range(4):
                  nested = [os.path.join(r, f) for r, _, fs in os.walk(dst) for f in fs if f.lower().endswith('.zip')]
                  if not nested: break
                  for n in nested:
                      with zipfile.ZipFile(n) as z: z.extractall(n[:-4] + '_x')
                      os.remove(n)
          def find_root(base):
              for r, ds, fs in os.walk(base):
                  ds[:] = [d for d in ds if d != 'node_modules']
                  if 'package.json' in fs and os.path.exists(os.path.join(r, 'www', 'index.html')): return r
          def ver(root):
              m = re.search(r"APP_VERSION='([0-9.]+)'", open(os.path.join(root, 'www', 'index.html'), encoding='utf-8').read())
              return tuple(int(x) for x in m.group(1).split('.')) if m else (0,)
          shutil.rmtree('proj', ignore_errors=True)
          cands = []
          for i, z in enumerate(sorted(glob.glob('*.zip'))):
              try: unpack(z, 'proj/c%d' % i)
              except Exception as e: print('skip', z, e); continue
              r = find_root('proj/c%d' % i)
              if r: cands.append((ver(r), r)); print('found', z, '->', r, ver(r))
          if os.path.exists('package.json') and os.path.exists('www/index.html'): cands.append((ver('.'), '.')); print('found loose project files')
          if not cands: raise SystemExit('No MediMate project found. Upload the MediMate_Native zip to the repo root.')
          cands.sort(key=lambda c: c[0])
          best = cands[-1][1]
          print('USING', best, cands[-1][0])
          open('/tmp/mm_root.txt', 'w').write(os.path.abspath(best))
          PY
          ROOT=$(cat /tmp/mm_root.txt)
          cd "$ROOT"
          VER=$(grep -o "APP_VERSION='[0-9.]*'" www/index.html | grep -o "[0-9][0-9.]*" | head -n1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [ -n "$AI_URL" ]; then sed -i "s#@@AI_URL@@#$AI_URL#; s#@@AI_CODE@@#$AI_CODE#" www/index.html; fi
          npm install
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#cfe0fc' --iconBackgroundColorDark '#cfe0fc' || echo "icon step skipped"
          mkdir -p android/app/src/main/java/com/abhi/medimate
          cp native/*.java android/app/src/main/java/com/abhi/medimate/
          python3 native/patch_manifest.py
          npx cap sync android
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MediMate.apk"
      - name: Verify APK signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          $BT/apksigner verify --print-certs MediMate.apk
          sha256sum MediMate.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: MediMate v${{ env.VER }}
          files: MediMate.apk
