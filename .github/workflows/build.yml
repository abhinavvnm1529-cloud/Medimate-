name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          set -e
          ZIP=$(ls *.zip | head -n1)
          unzip -o "$ZIP" -d proj
          ROOT=$(dirname "$(find proj -maxdepth 2 -name package.json | head -n1)")
          cd "$ROOT"
          npm install
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#cfe0fc' --iconBackgroundColorDark '#cfe0fc' || echo "icon step skipped"
          mkdir -p android/app/src/main/java/com/abhi/medimate
          cp native/*.java android/app/src/main/java/com/abhi/medimate/
          python3 native/patch_manifest.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MediMate.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MediMate v${{ github.run_number }}
          files: MediMate.apk
